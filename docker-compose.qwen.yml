services:
  qwen-classifier:
    image: safemaint-qwen-classifier:0.1.0
    build:
      context: .
      dockerfile: ai/Dockerfile.qwen-classifier
    restart: unless-stopped
    environment:
      QWEN_MODEL_ROOT: /model
      QWEN_DEVICE_MAP: ${QWEN_DEVICE_MAP:-auto}
      QWEN_ALLOW_REMOTE_CODE: ${QWEN_ALLOW_REMOTE_CODE:-false}
      QWEN_EAGER_LOAD: ${QWEN_EAGER_LOAD:-true}
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./safemaint_api_data/safemaint_qwen35_9b_finetuning_result/01_finetuned_model:/model:ro
      - safemaint_qwen_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8030/health/ready', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 120
      start_period: 30s

  backend:
    environment:
      OPENAI_API_KEY: local-model
      ALLOW_EXTERNAL_LLM: "false"
      LLM_PROVIDER_SCOPE: local
      LLM_BASE_URL: ${QWEN_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_ANALYZER_MODEL: ${QWEN_GENERAL_MODEL:-qwen3.5:4b}
      LLM_ANSWER_MODEL: ${QWEN_GENERAL_MODEL:-qwen3.5:4b}
      LLM_REASONING_EFFORT: none
      QWEN_CLASSIFIER_ENABLED: "true"
      QWEN_CLASSIFIER_URL: http://qwen-classifier:8030
      QWEN_CLASSIFIER_TIMEOUT_SECONDS: ${QWEN_CLASSIFIER_TIMEOUT_SECONDS:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qwen-classifier:
        condition: service_healthy

volumes:
  safemaint_qwen_models:
    name: ${QWEN_MODEL_VOLUME_NAME:-safemaint_qwen_models}
