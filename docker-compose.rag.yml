services:
  rag:
    image: safemaint-rag:0.1.0
    build:
      context: .
      dockerfile: ai/Dockerfile.rag
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-safemaint}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting SafeMaint}@db:5432/${RAG_DATABASE_NAME:-safemaint_rag_test}
      RAG_MODEL: ${RAG_MODEL:-BAAI/bge-m3}
      RAG_SOURCE_TYPES: ${RAG_SOURCE_TYPES:-}
      RAG_MODEL_CACHE_DIR: /models
      RAG_DEVICE: ${RAG_DEVICE:-cpu}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.25}
    volumes:
      - ${RAG_MODEL_CACHE_PATH:-./ai/.model-cache}:/models
    ports:
      - "127.0.0.1:${RAG_PORT:-8010}:8010"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    environment:
      RAG_SERVICE_URL: http://rag:8010
      RAG_REQUEST_TIMEOUT_SECONDS: ${RAG_REQUEST_TIMEOUT_SECONDS:-180}
    depends_on:
      rag:
        condition: service_healthy
